[package]
name = "rocket-api"
version = "0.1.0"
edition = "2021"

[dependencies]
rocket = "0.5"
rocket_contrib = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "mysql"] }
tokio = { version = "1.0", features = ["full"] }
dotenv = "0.15"
thiserror = "1.0"