[package]
name = "rocket-api"
version = "0.1.0"
edition = "2021"

[dependencies]
rocket = { version = "0.5.0-rc.3", features = ["json", "secrets"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "mysql", "macros"] }
tokio = { version = "1.0", features = ["full"] }
dotenvy = "0.15"
thiserror = "1.0"
dotenv = "0.15"  

